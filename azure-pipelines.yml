# CI for Application — runs in Azure Pipelines on every mirrored push.

trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    displayName: Use Node 22
    inputs:
      version: '22.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm test
    displayName: Run tests (vitest)

  - script: npm run build
    displayName: Production build
