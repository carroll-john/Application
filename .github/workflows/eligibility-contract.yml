name: Eligibility Contract

on:
  pull_request:
    paths:
      - "api/evaluate-transcript-eligibility.ts"
      - "api/evaluate-transcript-eligibility.test.ts"
      - "api/_ai/prompts/transcriptEligibility.v1.ts"
      - "api/_ai/schemas/transcriptEligibility.v1.ts"
      - "api/__fixtures__/transcript-service-contract.json"
      - "eligibility-service/src/server.mjs"
      - "src/lib/courseCatalog/normalize.ts"
      - "src/lib/courseCatalog/requirements.generated.json"
      - "src/lib/courseCatalog/requirementsLoader.ts"
      - "src/lib/courseCatalog/requirementsLoader.test.ts"
      - "src/lib/eligibility/**"
      - "scripts/eligibility-eval.ts"
      - "scripts/parse-course-requirements.ts"
      - "scripts/dump-eligibility-overrides.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - master
    paths:
      - "api/evaluate-transcript-eligibility.ts"
      - "api/evaluate-transcript-eligibility.test.ts"
      - "api/_ai/prompts/transcriptEligibility.v1.ts"
      - "api/_ai/schemas/transcriptEligibility.v1.ts"
      - "api/__fixtures__/transcript-service-contract.json"
      - "eligibility-service/src/server.mjs"
      - "src/lib/courseCatalog/normalize.ts"
      - "src/lib/courseCatalog/requirements.generated.json"
      - "src/lib/courseCatalog/requirementsLoader.ts"
      - "src/lib/courseCatalog/requirementsLoader.test.ts"
      - "src/lib/eligibility/**"
      - "scripts/eligibility-eval.ts"
      - "scripts/parse-course-requirements.ts"
      - "scripts/dump-eligibility-overrides.ts"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eligibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eligibility matcher eval
        run: npm run eligibility:eval
