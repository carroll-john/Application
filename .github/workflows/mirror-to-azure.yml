# Mirror this GitHub repo to Azure DevOps (org: carrolljohn, project: Application)
# One-way sync: GitHub is the source of truth; Azure Repos receives every push.
#
# Setup (once per repo):
#   1. Save this file as .github/workflows/mirror-to-azure.yml
#   2. Add a repository secret named AZURE_DEVOPS_PAT
#      (Azure DevOps PAT scoped to Code: Read & Write only)
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#
# The Azure repo must have the same name as the GitHub repo (it does).

name: Mirror to Azure DevOps

on:
  push:            # every branch push
  delete:          # branch/tag deletions sync too
  workflow_dispatch: # manual run button, for the first sync

concurrency:
  group: mirror-to-azure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch all branches locally
        run: |
          git fetch origin '+refs/heads/*:refs/heads/*' --prune

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote add azure "https://mirror:${AZURE_PAT}@dev.azure.com/carrolljohn/Application/_git/${REPO_NAME}"
          git push azure --all --force
          git push azure --tags --force
