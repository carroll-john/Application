# Mirror this GitHub repo to Azure DevOps (org: carrolljohn, project: Application)
# One-way sync: GitHub is the source of truth; Azure Repos receives every push.
# Requires repo secret AZURE_DEVOPS_PAT (Azure DevOps PAT, Code: Read & Write).

name: Mirror to Azure DevOps

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-azure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches and tags to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote set-head origin -d
          git remote add azure "https://dev.azure.com/carrolljohn/Application/_git/${REPO_NAME}"
          if [ -z "$AZURE_PAT" ]; then
            echo "AZURE_DEVOPS_PAT is empty." >&2
            exit 1
          fi
          echo "Azure PAT is present (${#AZURE_PAT} characters)."
          # Curl 8.23 strips credentials embedded in a remote URL, and Git 2.56
          # then discards them. Send the PAT as a Basic Authorization header
          # scoped to dev.azure.com instead.
          basic="$(printf 'mirror:%s' "$AZURE_PAT" | base64 -w 0)"
          azure_auth=(
            -c http.emptyAuth=false
            -c "http.https://dev.azure.com/.extraheader=AUTHORIZATION: Basic ${basic}"
          )
          git "${azure_auth[@]}" push azure 'refs/remotes/origin/*:refs/heads/*' --force
          git "${azure_auth[@]}" push azure --tags --force
