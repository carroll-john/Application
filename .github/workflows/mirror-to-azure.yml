# Mirror this GitHub repo to Azure DevOps (org: carrolljohn, project: Application)
# One-way sync: GitHub is the source of truth; Azure Repos receives every push.
# Requires repo secret AZURE_DEVOPS_PAT (Azure DevOps PAT, Code: Read & Write).

name: Mirror to Azure DevOps

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-azure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches and tags to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote set-head origin -d
          git remote add azure "https://dev.azure.com/carrolljohn/Application/_git/${REPO_NAME}"
          # Curl 8.23 removes credentials from the effective URL. Git 2.56 then
          # treats the remote as redirected and drops the username and password
          # that were embedded in the URL. A credential helper keeps the PAT
          # out of that path.
          azure_auth=(
            -c credential.helper=
            -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=mirror; echo "password=$AZURE_PAT"; }; f'
          )
          git "${azure_auth[@]}" push azure 'refs/remotes/origin/*:refs/heads/*' --force
          git "${azure_auth[@]}" push azure --tags --force
